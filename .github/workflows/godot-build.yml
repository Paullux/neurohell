name: "🎮 Build Godot — Windows & Linux"

# ────────────────────────────────────────────────────────────
#  Déclenchement
#   • Push d'un tag  v*.*.* → release publique automatique
#   • workflow_dispatch → build manuel avec choix de version
# ────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à releaser (ex : v1.0.0)"
        required: true
        default: "v0.1.0"

env:
  GODOT_VERSION: "4.6.2"
  GODOT_STABILITY: "stable"
  EXPORT_NAME: "NeuroHell"
  PROJECT_PATH: "."
  MINIO_URL: "https://assets.neurohell.com"
  MINIO_BUCKET: "neurohell/neurohell/godot"

jobs:
  # ──────────────────────────────────────────────────────────
  #  1. Export Windows + Linux (en parallèle)
  # ──────────────────────────────────────────────────────────
  export:
    name: "Export ${{ matrix.name }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: "Windows Desktop"
            out_file: "NeuroHell.exe"
            zip_name: "NeuroHell-Windows"
          - name: Linux
            preset: "Linux"
            out_file: "NeuroHell.x86_64"
            zip_name: "NeuroHell-Linux"

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📦 Pull assets depuis MinIO (CDN)"
        env:
          MC_USER: ${{ secrets.MINIO_USER }}
          MC_PASS: ${{ secrets.MINIO_PASS }}
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc

          # Vérifier que MinIO est joignable avant de continuer
          echo "→ Vérification de la connexion MinIO…"
          for i in 1 2 3; do
            if curl -sf --max-time 10 "$MINIO_URL/minio/health/live" > /dev/null 2>&1; then
              echo "✅ MinIO joignable (tentative $i)"
              break
            fi
            echo "⚠️  Tentative $i/3 échouée, attente 15s…"
            sleep 15
            if [ $i -eq 3 ]; then
              echo "❌ MinIO inaccessible après 3 tentatives — vérifier le serveur assets.neurohell.com"
              exit 1
            fi
          done

          ./mc alias set neurohell "$MINIO_URL" "$MC_USER" "$MC_PASS"

          echo "→ Téléchargement des assets…"
          ./mc cp --recursive "$MINIO_BUCKET/levels/"  assets/levels/
          ./mc cp --recursive "$MINIO_BUCKET/demons/"  assets/demons/
          ./mc cp --recursive "$MINIO_BUCKET/weapons/" assets/weapons/
          ./mc cp --recursive "$MINIO_BUCKET/decor/"   assets/decor/
          ./mc cp --recursive "$MINIO_BUCKET/videos/"  assets/videos/
          # audio/musics/ est en git direct — pas besoin de MinIO

          echo "→ Assets téléchargés :"
          du -sh assets/*/

      - name: "⚙️  Installer Godot ${{ env.GODOT_VERSION }}"
        run: |
          FULL="${GODOT_VERSION}-${GODOT_STABILITY}"          # tag GitHub : 4.6.2-stable
          TPL_NAME="${GODOT_VERSION}.${GODOT_STABILITY}"      # dossier Godot : 4.6.2.stable
          BASE="https://github.com/godotengine/godot/releases/download/${FULL}"

          echo "→ Téléchargement de Godot headless…"
          wget -q "${BASE}/Godot_v${FULL}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${FULL}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          echo "→ Téléchargement des templates d'export…"
          TPL_DIR="${HOME}/.local/share/godot/export_templates/${TPL_NAME}"
          mkdir -p "${TPL_DIR}"
          wget -q "${BASE}/Godot_v${FULL}_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "${TPL_DIR}/"
          rm -rf tpl_tmp templates.tpz godot.zip
          echo "Templates installés dans ${TPL_DIR}"

      - name: "🔢 Écrire le fichier de version"
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          fi
          BUILD_DATE=$(date +%Y-%m-%d)

          cat > "${{ env.PROJECT_PATH }}/scripts/game_version.gd" << EOF
          # AUTO-GENERATED BY CI — NE PAS ÉDITER MANUELLEMENT
          class_name GameVersion
          const VERSION    := "${VERSION}"
          const BUILD_DATE := "${BUILD_DATE}"
          EOF
          echo "Version : ${VERSION}  —  Build : ${BUILD_DATE}"

      - name: "🧱 Import des assets Godot"
        run: |
          cd "${{ env.PROJECT_PATH }}"
          timeout 60 godot --headless --import 2>&1 | tail -10 || true

      - name: "📦 Export ${{ matrix.name }}"
        run: |
          mkdir -p "build/${{ matrix.zip_name }}"
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --export-release \
            "${{ matrix.preset }}" \
            "${{ github.workspace }}/build/${{ matrix.zip_name }}/${{ matrix.out_file }}" \
            2>&1

          echo "→ Contenu du build :"
          ls -lh "${{ github.workspace }}/build/${{ matrix.zip_name }}/"

      - name: "🗜  Zipper le build"
        run: |
          cd "build/${{ matrix.zip_name }}"
          zip -r "../../${{ matrix.zip_name }}.zip" .
          echo "Archive : $(du -sh ../../${{ matrix.zip_name }}.zip)"

      - name: "🪟 Créer installeur NSIS (Windows uniquement)"
        if: matrix.name == 'Windows'
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          fi

          # ── Dépendances ───────────────────────────────────────
          sudo apt-get install -y -q nsis imagemagick

          # ── Icône PNG → ICO multi-tailles (via Pillow, sans policy ImageMagick) ──
          pip install -q Pillow
          python3 -c "from PIL import Image; img = Image.open('assets/images/icon/icon.png').convert('RGBA'); img.save('installer/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); print('ICO OK')"

          # ── Compiler l'installeur ─────────────────────────────
          makensis -DAPP_VERSION="${VERSION}" installer/neurohell.nsi

          mv NeuroHell-Setup.exe "NeuroHell-${VERSION}-Setup.exe"
          echo "→ Installeur : $(ls -lh NeuroHell-*-Setup.exe)"

      - name: "⬆️  Upload artifact installeur (Windows uniquement)"
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeuroHell-Setup
          path: NeuroHell-*-Setup.exe
          retention-days: 14

      - name: "📦 Créer AppImage (Linux uniquement)"
        if: matrix.name == 'Linux'
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          fi

          # ── Structure AppDir ──────────────────────────────────
          mkdir -p AppDir/usr/bin

          cp build/NeuroHell-Linux/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/NeuroHell.x86_64

          # AppRun
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/NeuroHell.x86_64" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Desktop entry
          cat > AppDir/NeuroHell.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=NeuroHell
          Exec=NeuroHell.x86_64
          Icon=NeuroHell
          Type=Application
          Categories=Game;ActionGame;
          Comment=Roguelite FPS cyberpunk / horror
          DESKTOP

          # Icône PNG depuis les assets
          cp assets/images/icon/icon.png AppDir/NeuroHell.png

          # ── appimagetool ──────────────────────────────────────
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -O appimagetool
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir "NeuroHell-${VERSION}-Linux.AppImage"

          echo "→ AppImage : $(ls -lh NeuroHell-*.AppImage)"

      - name: "⬆️  Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}.zip
          retention-days: 14

      - name: "⬆️  Upload AppImage artifact (Linux uniquement)"
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeuroHell-AppImage
          path: NeuroHell-*-Linux.AppImage
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  #  2. Créer la GitHub Release avec les deux builds
  # ──────────────────────────────────────────────────────────
  release:
    name: "🚀 GitHub Release"
    needs: export
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: "📥 Télécharger les artifacts"
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          pattern: "NeuroHell-*"

      - name: "🔢 Déterminer la version"
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: "📋 Lister les fichiers disponibles"
        run: ls -lh

      - name: "🏷  Créer la Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "NeuroHell ${{ steps.ver.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            NeuroHell-*-Setup.exe
            NeuroHell-Windows.zip
            NeuroHell-Linux.zip
            NeuroHell-*-Linux.AppImage
          body: |
            ## 🎮 NeuroHell — ${{ steps.ver.outputs.version }}

            Roguelite FPS cyberpunk / horror · Godot 4 · Build automatisé

            ---

            ### 💾 Téléchargements

            | Plateforme | Fichier | Instructions |
            |---|---|---|
            | 🪟 **Windows (installeur)** | [NeuroHell-${{ steps.ver.outputs.version }}-Setup.exe](https://github.com/Paullux/neurohell/releases/download/${{ steps.ver.outputs.version }}/NeuroHell-${{ steps.ver.outputs.version }}-Setup.exe) | Double-clic et suivre l'assistant |
            | 🪟 **Windows (zip)** | [NeuroHell-Windows.zip](https://github.com/Paullux/neurohell/releases/download/${{ steps.ver.outputs.version }}/NeuroHell-Windows.zip) | Extraire et lancer `NeuroHell.exe` |
            | 🐧 **Linux (AppImage)** | [NeuroHell-${{ steps.ver.outputs.version }}-Linux.AppImage](https://github.com/Paullux/neurohell/releases/download/${{ steps.ver.outputs.version }}/NeuroHell-${{ steps.ver.outputs.version }}-Linux.AppImage) | `chmod +x *.AppImage && ./NeuroHell-*.AppImage` |
            | 🐧 **Linux (zip)** | [NeuroHell-Linux.zip](https://github.com/Paullux/neurohell/releases/download/${{ steps.ver.outputs.version }}/NeuroHell-Linux.zip) | `chmod +x NeuroHell.x86_64 && ./NeuroHell.x86_64` |

            ---

            ### ⚙️ Configuration minimale

            | | Minimum |
            |---|---|
            | GPU | Vulkan 1.0 ou OpenGL 3.3 |
            | RAM | 4 Go |
            | OS Windows | Windows 10 64-bit |
            | OS Linux | Distribution récente, glibc ≥ 2.31 |

            ---

            > Build automatisé par GitHub Actions · Godot ${{ env.GODOT_VERSION }}

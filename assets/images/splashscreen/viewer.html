<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NeuroHell — Splash Viewer 1920×1080</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #ccc;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    gap: 12px;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 14px;
    width: 100%;
    max-width: 1200px;
    flex-wrap: wrap;
  }

  #toolbar label { color: #888; }
  #toolbar strong { color: #fff; }

  .sep { width: 1px; height: 20px; background: #333; margin: 0 4px; }

  button {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #ccc;
    border-radius: 5px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    transition: background .15s;
  }
  button:hover { background: #3a3a3a; color: #fff; }
  button.active { background: #c0392b; border-color: #e74c3c; color: #fff; }

  input[type=range] { accent-color: #e74c3c; cursor: pointer; width: 120px; }

  #viewport-wrap {
    position: relative;
    width: 100%;
    max-width: 1200px;
  }

  #frame {
    position: relative;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    background: #000;
    overflow: hidden;
    border: 2px solid #333;
  }

  #frame img, #frame video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  #frame img.active, #frame video.active { display: block; }

  #cover-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    display: none;
  }
  #cover-overlay.visible { display: block; }

  #info-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,.65);
    padding: 6px 12px;
    font-size: 11px;
    color: #aaa;
    display: flex;
    gap: 16px;
  }
  #info-bar span { color: #e74c3c; font-weight: bold; }

  #scale-label {
    color: #666;
    font-size: 12px;
    white-space: nowrap;
  }

  #compat-warn {
    background: #2a1a00;
    border: 1px solid #7a4a00;
    border-radius: 6px;
    padding: 8px 14px;
    color: #ffaa55;
    display: none;
    max-width: 1200px;
    width: 100%;
  }
</style>
</head>
<body>

<div id="toolbar">
  <strong>NeuroHell Splash Viewer</strong>
  <span class="sep"></span>

  <button id="btn-img" class="active" onclick="show('img')">Image</button>
  <button id="btn-vid" onclick="show('vid')">Vidéo (OGV)</button>

  <span class="sep"></span>

  <label>Zoom :</label>
  <input type="range" id="zoom" min="20" max="100" value="60"
         oninput="applyZoom(this.value)">
  <span id="scale-label">60 %</span>

  <span class="sep"></span>

  <label>Simuler fenêtre :</label>
  <button onclick="simWindow(1920,1080)">1920×1080</button>
  <button onclick="simWindow(1717,916)">1717×916</button>
  <button onclick="simWindow(1366,768)">1366×768</button>
  <button onclick="simWindow(1280,720)">1280×720</button>
  <button onclick="simWindow(0,0)">Aucun</button>

  <span class="sep"></span>

  <button id="btn-play" onclick="togglePlay()" style="display:none">▶ Play</button>
</div>

<div id="compat-warn" id="warn">
  ⚠ Les fichiers <strong>.ogv</strong> ne sont pas supportés par Chrome/Edge. Ouvre ce fichier avec <strong>Firefox</strong> pour voir la vidéo.
</div>

<div id="viewport-wrap">
  <div id="frame">
    <img  id="el-img" class="active" src="le_soldat_et_le_portail_mystique.png" alt="Splash image">
    <video id="el-vid" src="intro.ogv" preload="metadata" loop></video>

    <svg id="cover-overlay" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="info-bar">
      Taille native : <span>1920 × 1080</span> &nbsp;|&nbsp;
      Ratio : <span>16:9 (1.778)</span> &nbsp;|&nbsp;
      <span id="sim-info">Aucune simulation active</span>
    </div>
  </div>
</div>

<script>
const frame   = document.getElementById('frame');
const elImg   = document.getElementById('el-img');
const elVid   = document.getElementById('el-vid');
const overlay = document.getElementById('cover-overlay');
const simInfo = document.getElementById('sim-info');
const btnPlay = document.getElementById('btn-play');
const warn    = document.getElementById('compat-warn');

let currentZoom = 60;
let current = 'img';

function applyZoom(v) {
  currentZoom = +v;
  document.getElementById('scale-label').textContent = v + ' %';
  const s = v / 100;
  frame.style.transform = `scale(${s})`;
  document.getElementById('viewport-wrap').style.height = (1080 * s + 32) + 'px';
}

function show(type) {
  current = type;
  document.getElementById('btn-img').classList.toggle('active', type === 'img');
  document.getElementById('btn-vid').classList.toggle('active', type === 'vid');
  elImg.classList.toggle('active', type === 'img');
  elVid.classList.toggle('active', type === 'vid');
  btnPlay.style.display = type === 'vid' ? 'inline-block' : 'none';
  if (type === 'vid') {
    warn.style.display = 'block';
    const ok = elVid.canPlayType('video/ogg; codecs="theora"') !== '';
    if (ok) warn.style.display = 'none';
  } else {
    warn.style.display = 'none';
    elVid.pause();
  }
}

function togglePlay() {
  if (elVid.paused) { elVid.play(); btnPlay.textContent = '⏸ Pause'; }
  else              { elVid.pause(); btnPlay.textContent = '▶ Play'; }
}

function simWindow(w, h) {
  overlay.innerHTML = '';
  overlay.classList.remove('visible');
  simInfo.textContent = 'Aucune simulation active';
  if (!w) return;

  overlay.setAttribute('width',  1920);
  overlay.setAttribute('height', 1080);
  overlay.style.width  = '1920px';
  overlay.style.height = '1080px';
  overlay.classList.add('visible');

  const imgW = 1920, imgH = 1080;
  const scale = Math.max(w / imgW, h / imgH);
  const sw = imgW * scale, sh = imgH * scale;
  const ox = (sw - w) / 2, oy = (sh - h) / 2;

  const vx = (imgW - sw) / 2 + ox;
  const vy = (imgH - sh) / 2 + oy;

  const ns = 'http://www.w3.org/2000/svg';

  const mask = document.createElementNS(ns, 'mask');
  mask.setAttribute('id', 'wm');
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('width', 1920); bg.setAttribute('height', 1080);
  bg.setAttribute('fill', 'white');
  const hole = document.createElementNS(ns, 'rect');
  hole.setAttribute('x', vx); hole.setAttribute('y', vy);
  hole.setAttribute('width', w); hole.setAttribute('height', h);
  hole.setAttribute('fill', 'black');
  mask.appendChild(bg); mask.appendChild(hole);

  const defs = document.createElementNS(ns, 'defs');
  defs.appendChild(mask);
  overlay.appendChild(defs);

  const shade = document.createElementNS(ns, 'rect');
  shade.setAttribute('width', 1920); shade.setAttribute('height', 1080);
  shade.setAttribute('fill', 'rgba(0,0,0,0.65)');
  shade.setAttribute('mask', 'url(#wm)');
  overlay.appendChild(shade);

  const rect = document.createElementNS(ns, 'rect');
  rect.setAttribute('x', vx); rect.setAttribute('y', vy);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('fill', 'none');
  rect.setAttribute('stroke', '#e74c3c');
  rect.setAttribute('stroke-width', '3');
  rect.setAttribute('stroke-dasharray', '12 6');
  overlay.appendChild(rect);

  const ratio = (w/h).toFixed(3);
  const scP   = Math.round(scale * 100);
  simInfo.innerHTML = `Fenêtre <strong style="color:#e74c3c">${w}×${h}</strong> (ratio ${ratio}) — zoom cover : ${scP}% — rogné : ${Math.round(Math.abs(ox*2))}×${Math.round(Math.abs(oy*2))}px`;
}

applyZoom(currentZoom);
</script>
</body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Routes propres pour les pages preview séparées ──────────
    location = /demons { try_files /demons_preview.html =404; }
    location = /hud    { try_files /hud_demo.html =404; }
    location = /weapon { try_files /weapon_preview.html =404; }

    # ── SPA : toutes les autres routes → index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache assets statiques ───────────────────────────────────
    # Docs markdown : jamais mis en cache (contenu mis à jour à chaque build)
    location ~* /assets/docs/.*\.md$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        access_log off;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|glb|gltf|bin|mp3|wav|ogg|ogv|mp4|exr|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
